<svg viewBox="0 0 520 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="520" height="380" fill="#F7F5F0" rx="12"/>
  <line x1="0" y1="90" x2="520" y2="90" stroke="#E8E4DC" stroke-width="1"/>
  <line x1="260" y1="0" x2="260" y2="380" stroke="#E8E4DC" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- SMS CARD — top left -->
  <rect x="20" y="24" width="210" height="80" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <rect x="32" y="36" width="36" height="16" rx="8" fill="#34d399" fill-opacity="0.15"/>
  <text x="50" y="47" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#059669" text-anchor="middle">SMS</text>
  <text x="216" y="47" font-family="system-ui, sans-serif" font-size="8.5" fill="#B0ABA4" text-anchor="end">3 min ago</text>
  <text x="32" y="68" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1A1814">Can I check in at 11am?</text>
  <text x="32" y="83" font-family="system-ui, sans-serif" font-size="9.5" fill="#8C8780">Arriving by car from London</text>
  <rect x="32" y="90" width="52" height="14" rx="7" fill="#16a34a" fill-opacity="0.1"/>
  <text x="58" y="100" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#16a34a" text-anchor="middle">✓ Confirmed</text>

  <!-- WhatsApp CARD — top right -->
  <rect x="246" y="24" width="210" height="80" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <rect x="258" y="36" width="58" height="16" rx="8" fill="#25D366" fill-opacity="0.12"/>
  <text x="287" y="47" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#128C7E" text-anchor="middle">WhatsApp</text>
  <text x="444" y="47" font-family="system-ui, sans-serif" font-size="8.5" fill="#B0ABA4" text-anchor="end">9 min ago</text>
  <text x="258" y="68" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1A1814">Where do I park the car?</text>
  <text x="258" y="83" font-family="system-ui, sans-serif" font-size="9.5" fill="#8C8780">Checking in this afternoon</text>
  <rect x="258" y="90" width="58" height="14" rx="7" fill="#16a34a" fill-opacity="0.1"/>
  <text x="287" y="100" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#16a34a" text-anchor="middle">✓ Directions sent</text>

  <!-- Email CARD — bottom left -->
  <rect x="20" y="200" width="210" height="80" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <rect x="32" y="212" width="38" height="16" rx="8" fill="#B8A060" fill-opacity="0.12"/>
  <text x="51" y="223" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#8A6A20" text-anchor="middle">Email</text>
  <text x="216" y="223" font-family="system-ui, sans-serif" font-size="8.5" fill="#B0ABA4" text-anchor="end">22 min ago</text>
  <text x="32" y="244" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1A1814">AC not working in room 14</text>
  <text x="32" y="259" font-family="system-ui, sans-serif" font-size="9.5" fill="#8C8780">Please send someone to fix it</text>
  <rect x="32" y="266" width="68" height="14" rx="7" fill="#f59e0b" fill-opacity="0.12"/>
  <text x="66" y="276" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#b45309" text-anchor="middle">↑ Escalated</text>

  <!-- Direct CARD — bottom right -->
  <rect x="246" y="200" width="210" height="80" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <rect x="258" y="212" width="48" height="16" rx="8" fill="#6366f1" fill-opacity="0.1"/>
  <text x="282" y="223" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#4f46e5" text-anchor="middle">Direct</text>
  <text x="444" y="223" font-family="system-ui, sans-serif" font-size="8.5" fill="#B0ABA4" text-anchor="end">35 min ago</text>
  <text x="258" y="244" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1A1814">Late check-out until 1pm?</text>
  <text x="258" y="259" font-family="system-ui, sans-serif" font-size="9.5" fill="#8C8780">Flight isn't until 4pm</text>
  <rect x="258" y="266" width="52" height="14" rx="7" fill="#16a34a" fill-opacity="0.1"/>
  <text x="284" y="276" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#16a34a" text-anchor="middle">✓ Confirmed</text>

  <!-- CENTRAL HANDLED BADGE — connecting the four cards visually -->
  <rect x="186" y="152" width="148" height="56" rx="10" fill="white" stroke="#B8A060" stroke-width="1.5"/>
  <text x="260" y="172" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1A1814" text-anchor="middle">All channels</text>
  <text x="260" y="186" font-family="system-ui, sans-serif" font-size="9.5" fill="#8C8780" text-anchor="middle">monitored &amp; handled</text>
  <rect x="210" y="192" width="100" height="8" rx="4" fill="#E8E4DC"/>
  <rect x="210" y="192" width="80" height="8" rx="4" fill="#B8A060" fill-opacity="0.5"/>

  <!-- Connector lines to center -->
  <line x1="125" y1="104" x2="125" y2="152" stroke="#E8E4DC" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="125" y1="152" x2="186" y2="175" stroke="#E8E4DC" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="351" y1="104" x2="351" y2="152" stroke="#E8E4DC" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="351" y1="152" x2="334" y2="175" stroke="#E8E4DC" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="125" y1="200" x2="125" y2="208" stroke="#E8E4DC" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="125" y1="200" x2="186" y2="185" stroke="#E8E4DC" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="351" y1="200" x2="334" y2="185" stroke="#E8E4DC" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- STATS ROW -->
  <rect x="20" y="304" width="148" height="52" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <text x="34" y="328" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1A1814">5 channels</text>
  <text x="34" y="344" font-family="system-ui, sans-serif" font-size="9" fill="#8C8780">SMS, WA, email + more</text>

  <rect x="186" y="304" width="148" height="52" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <text x="200" y="328" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#1A1814">24 / 7</text>
  <text x="200" y="344" font-family="system-ui, sans-serif" font-size="9" fill="#8C8780">Coverage hours available</text>

  <rect x="352" y="304" width="148" height="52" rx="8" fill="#B8A060" fill-opacity="0.08" stroke="#B8A060" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="366" y="328" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#8A6A20">1 brief</text>
  <text x="366" y="344" font-family="system-ui, sans-serif" font-size="9" fill="#B8A060">per property, per listing</text>
</svg>
