<svg viewBox="0 0 520 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="520" height="380" fill="#F7F5F0" rx="12"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="80" x2="520" y2="80" stroke="#E8E4DC" stroke-width="1"/>
  <line x1="0" y1="160" x2="520" y2="160" stroke="#E8E4DC" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- INBOX PANEL -->
  <rect x="24" y="24" width="472" height="52" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <!-- Inbox label -->
  <circle cx="48" cy="50" r="12" fill="#B8A060" fill-opacity="0.15"/>
  <rect x="43" y="45" width="10" height="10" rx="2" fill="#B8A060"/>
  <text x="68" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1A1814" letter-spacing="0.03em">Guest Messages</text>
  <text x="68" y="62" font-family="system-ui, sans-serif" font-size="10" fill="#8C8780">OTA inbox — all platforms</text>
  <!-- Badge -->
  <rect x="430" y="38" width="52" height="22" rx="11" fill="#B8A060" fill-opacity="0.15"/>
  <text x="456" y="53" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#8A6A20" text-anchor="middle">12 new</text>

  <!-- MESSAGE CARD 1 — Booking.com / Pre-booking -->
  <rect x="24" y="92" width="228" height="84" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <!-- Platform pill -->
  <rect x="36" y="104" width="78" height="18" rx="9" fill="#003580" fill-opacity="0.08"/>
  <text x="75" y="116" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#003580" text-anchor="middle">Booking.com</text>
  <!-- Time -->
  <text x="236" y="116" font-family="system-ui, sans-serif" font-size="9" fill="#B0ABA4" text-anchor="end">2 min ago</text>
  <!-- Message preview -->
  <text x="36" y="135" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1A1814">Do you have availability for...</text>
  <text x="36" y="150" font-family="system-ui, sans-serif" font-size="9.5" fill="#8C8780">Aug 14–17? Twin room, 2 guests</text>
  <!-- Status -->
  <rect x="36" y="160" width="58" height="6" rx="3" fill="#E8E4DC"/>
  <rect x="36" y="160" width="20" height="6" rx="3" fill="#B8A060" fill-opacity="0.5"/>

  <!-- MESSAGE CARD 2 — Airbnb / In-stay -->
  <rect x="268" y="92" width="228" height="84" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <rect x="280" y="104" width="52" height="18" rx="9" fill="#FF5A5F" fill-opacity="0.1"/>
  <text x="306" y="116" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#c0392b" text-anchor="middle">Airbnb</text>
  <text x="480" y="116" font-family="system-ui, sans-serif" font-size="9" fill="#B0ABA4" text-anchor="end">8 min ago</text>
  <text x="280" y="135" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1A1814">What's the WiFi password?</text>
  <text x="280" y="150" font-family="system-ui, sans-serif" font-size="9.5" fill="#8C8780">Checked in this morning — thanks</text>
  <!-- Handled badge -->
  <rect x="280" y="158" width="52" height="14" rx="7" fill="#16a34a" fill-opacity="0.1"/>
  <text x="306" y="168" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#16a34a" text-anchor="middle">✓ Replied</text>

  <!-- MESSAGE CARD 3 — Expedia / Modification -->
  <rect x="24" y="192" width="228" height="84" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <rect x="36" y="204" width="52" height="18" rx="9" fill="#00356B" fill-opacity="0.08"/>
  <text x="62" y="216" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#00356B" text-anchor="middle">Expedia</text>
  <text x="236" y="216" font-family="system-ui, sans-serif" font-size="9" fill="#B0ABA4" text-anchor="end">14 min ago</text>
  <text x="36" y="235" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1A1814">Can I change my check-in to 3pm?</text>
  <text x="36" y="250" font-family="system-ui, sans-serif" font-size="9.5" fill="#8C8780">Arriving by car — confirm receipt</text>
  <rect x="36" y="260" width="58" height="6" rx="3" fill="#E8E4DC"/>
  <rect x="36" y="260" width="38" height="6" rx="3" fill="#B8A060" fill-opacity="0.5"/>

  <!-- MESSAGE CARD 4 — Vrbo / Review response -->
  <rect x="268" y="192" width="228" height="84" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <rect x="280" y="204" width="42" height="18" rx="9" fill="#1B4596" fill-opacity="0.08"/>
  <text x="301" y="216" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#1B4596" text-anchor="middle">Vrbo</text>
  <text x="480" y="216" font-family="system-ui, sans-serif" font-size="9" fill="#B0ABA4" text-anchor="end">31 min ago</text>
  <text x="280" y="235" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1A1814">Is the pool heated in October?</text>
  <text x="280" y="250" font-family="system-ui, sans-serif" font-size="9.5" fill="#8C8780">Thinking of booking for a week</text>
  <rect x="280" y="258" width="52" height="14" rx="7" fill="#16a34a" fill-opacity="0.1"/>
  <text x="306" y="268" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#16a34a" text-anchor="middle">✓ Replied</text>

  <!-- STATS ROW -->
  <rect x="24" y="292" width="140" height="68" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <text x="34" y="316" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1A1814">98%</text>
  <text x="34" y="332" font-family="system-ui, sans-serif" font-size="9.5" fill="#8C8780">Response rate</text>
  <text x="34" y="348" font-family="system-ui, sans-serif" font-size="9" fill="#B0ABA4">across all platforms</text>

  <rect x="180" y="292" width="140" height="68" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <text x="190" y="316" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1A1814">&lt; 15m</text>
  <text x="190" y="332" font-family="system-ui, sans-serif" font-size="9.5" fill="#8C8780">First response</text>
  <text x="190" y="348" font-family="system-ui, sans-serif" font-size="9" fill="#B0ABA4">typical first reply time</text>

  <rect x="336" y="292" width="160" height="68" rx="8" fill="#B8A060" fill-opacity="0.08" stroke="#B8A060" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="346" y="316" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#8A6A20">5 OTAs</text>
  <text x="346" y="332" font-family="system-ui, sans-serif" font-size="9.5" fill="#8A6A20">Platforms covered</text>
  <text x="346" y="348" font-family="system-ui, sans-serif" font-size="9" fill="#B8A060">more on request</text>
</svg>
