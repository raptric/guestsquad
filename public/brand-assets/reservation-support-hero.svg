<svg viewBox="0 0 520 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="520" height="380" fill="#F7F5F0" rx="12"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="80" x2="520" y2="80" stroke="#E8E4DC" stroke-width="1"/>
  <line x1="0" y1="200" x2="520" y2="200" stroke="#E8E4DC" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- CHANNEL INPUTS — left side -->
  <!-- Phone -->
  <rect x="20" y="52" width="130" height="52" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <circle cx="40" cy="78" r="10" fill="#B8A060" fill-opacity="0.15"/>
  <text x="40" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#8A6A20" text-anchor="middle">☎</text>
  <text x="58" y="74" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1A1814">Phone</text>
  <text x="58" y="88" font-family="system-ui, sans-serif" font-size="9" fill="#8C8780">Inbound call</text>

  <!-- Booking.com -->
  <rect x="20" y="164" width="130" height="52" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <circle cx="40" cy="190" r="10" fill="#003580" fill-opacity="0.1"/>
  <text x="40" y="194" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#003580" text-anchor="middle">B.</text>
  <text x="58" y="186" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1A1814">Booking.com</text>
  <text x="58" y="200" font-family="system-ui, sans-serif" font-size="9" fill="#8C8780">OTA message</text>

  <!-- Email -->
  <rect x="20" y="276" width="130" height="52" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <circle cx="40" cy="302" r="10" fill="#B8A060" fill-opacity="0.12"/>
  <text x="40" y="306" font-family="system-ui, sans-serif" font-size="10" fill="#8A6A20" text-anchor="middle">✉</text>
  <text x="58" y="298" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1A1814">Email</text>
  <text x="58" y="312" font-family="system-ui, sans-serif" font-size="9" fill="#8C8780">Direct enquiry</text>

  <!-- Arrows pointing right -->
  <line x1="152" y1="78" x2="178" y2="78" stroke="#E8E4DC" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="176,74 184,78 176,82" fill="#E8E4DC"/>
  <line x1="152" y1="190" x2="178" y2="190" stroke="#E8E4DC" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="176,186 184,190 176,194" fill="#E8E4DC"/>
  <line x1="152" y1="302" x2="178" y2="302" stroke="#E8E4DC" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="176,298 184,302 176,306" fill="#E8E4DC"/>

  <!-- Lines converging to center card -->
  <line x1="184" y1="78" x2="184" y2="190" stroke="#E8E4DC" stroke-width="1.5"/>
  <line x1="184" y1="302" x2="184" y2="190" stroke="#E8E4DC" stroke-width="1.5"/>
  <line x1="184" y1="190" x2="198" y2="190" stroke="#E8E4DC" stroke-width="1.5"/>

  <!-- CENTRAL BOOKING CARD -->
  <rect x="198" y="118" width="168" height="144" rx="10" fill="white" stroke="#B8A060" stroke-width="1.5"/>
  <!-- Confirmed badge -->
  <rect x="214" y="130" width="68" height="18" rx="9" fill="#16a34a" fill-opacity="0.1"/>
  <text x="248" y="142" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#16a34a" text-anchor="middle">✓ Confirmed</text>
  <!-- Property name -->
  <text x="214" y="166" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1A1814">The Harbour Hotel</text>
  <text x="214" y="181" font-family="system-ui, sans-serif" font-size="9.5" fill="#8C8780">Aug 14 → Aug 17 · 3 nights</text>
  <line x1="214" y1="192" x2="350" y2="192" stroke="#E8E4DC" stroke-width="1"/>
  <!-- Rate -->
  <text x="214" y="208" font-family="system-ui, sans-serif" font-size="9" fill="#8C8780">Rate</text>
  <text x="214" y="222" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1A1814">£149 / night</text>
  <!-- Room -->
  <text x="295" y="208" font-family="system-ui, sans-serif" font-size="9" fill="#8C8780">Room</text>
  <text x="295" y="222" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1A1814">Twin Deluxe</text>
  <line x1="214" y1="232" x2="350" y2="232" stroke="#E8E4DC" stroke-width="1"/>
  <text x="214" y="248" font-family="system-ui, sans-serif" font-size="9" fill="#8C8780">Booked via Booking.com · ref #HH-2814</text>

  <!-- Arrow right from center card -->
  <line x1="368" y1="190" x2="384" y2="190" stroke="#E8E4DC" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="382,186 390,190 382,194" fill="#E8E4DC"/>

  <!-- ACTION LOG CARD — right side -->
  <rect x="390" y="118" width="112" height="144" rx="8" fill="white" stroke="#E8E4DC" stroke-width="1.5"/>
  <text x="402" y="138" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#8C8780" letter-spacing="0.05em">ACTION LOG</text>
  <line x1="402" y1="144" x2="490" y2="144" stroke="#E8E4DC" stroke-width="1"/>
  <!-- Log entries -->
  <circle cx="410" cy="160" r="4" fill="#16a34a" fill-opacity="0.3"/>
  <text x="420" y="164" font-family="system-ui, sans-serif" font-size="8.5" fill="#1A1814">Availability</text>
  <text x="420" y="175" font-family="system-ui, sans-serif" font-size="8" fill="#8C8780">Quoted</text>

  <circle cx="410" cy="192" r="4" fill="#16a34a" fill-opacity="0.3"/>
  <text x="420" y="196" font-family="system-ui, sans-serif" font-size="8.5" fill="#1A1814">Booking</text>
  <text x="420" y="207" font-family="system-ui, sans-serif" font-size="8" fill="#8C8780">Confirmed</text>

  <circle cx="410" cy="224" r="4" fill="#B8A060" fill-opacity="0.4"/>
  <text x="420" y="228" font-family="system-ui, sans-serif" font-size="8.5" fill="#1A1814">Group req.</text>
  <text x="420" y="239" font-family="system-ui, sans-serif" font-size="8" fill="#8C8780">Escalated</text>

  <!-- STATS ROW -->
  <rect x="20" y="344" width="148" height="24" rx="6" fill="white" stroke="#E8E4DC" stroke-width="1"/>
  <text x="34" y="360" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1A1814">All actions within brief</text>

  <rect x="184" y="344" width="148" height="24" rx="6" fill="white" stroke="#E8E4DC" stroke-width="1"/>
  <text x="198" y="360" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1A1814">Every channel covered</text>

  <rect x="348" y="344" width="154" height="24" rx="6" fill="#B8A060" fill-opacity="0.08" stroke="#B8A060" stroke-width="1" stroke-opacity="0.3"/>
  <text x="362" y="360" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#8A6A20">Full handover log</text>
</svg>
